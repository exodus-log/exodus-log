name: update-data
# Refreshes assets/data.js from the race tracker (pro.yb.tl) and Open-Meteo, with no Claude involved.
# The mode comes from the repository variable EXO_MODE:
#   compare (the default while it is unset) - writes nothing to the site; the run summary compares
#                                             the script's numbers with the live data.js
#   publish                                 - commits assets/data.js when there is a new position fix
# assets/fleet-log.js (the growing fleet history) is committed in BOTH modes, at most once every four hours.
# STORY is never touched: the story sentence stays with the Claude refresh.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'compare or publish (empty = the EXO_MODE variable)'
        required: false
        default: ''
      weather:
        description: 'compare mode: fetch weather on this run too'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compute
        id: run
        env:
          EXO_MODE: ${{ inputs.mode || vars.EXO_MODE || 'compare' }}
          EXO_WEATHER: ${{ inputs.weather && '1' || '' }}
        run: node scripts/update-data.mjs
      - name: Keep the files for comparison
        if: always() && (failure() || (inputs.mode || vars.EXO_MODE || 'compare') == 'compare')
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: out/
          retention-days: 5
          if-no-files-found: ignore
      # assets/fleet-log.js grows by one point per boat every four hours, in both modes: it is what keeps
      # the globe's day strip honest once the baked history in course.js runs out. It never touches data.js.
      - name: Publish
        if: steps.run.outputs.changed == 'true' || steps.run.outputs.logged == 'true'
        env:
          MSG: "${{ steps.run.outputs.message || 'היסטוריית הצי: נקודות חדשות' }}"
        run: |
          git config user.name "exodus-log data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js assets/fleet-log.js
          git diff --cached --quiet || git commit -m "$MSG"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
