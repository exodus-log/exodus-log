name: update-data
# Refreshes assets/data.js from the race tracker (pro.yb.tl) and Open-Meteo, with no Claude involved.
# The mode comes from the repository variable EXO_MODE:
#   compare (the default while it is unset) - writes nothing to the site; the run summary compares
#                                             the script's numbers with the live data.js
#   publish                                 - commits assets/data.js when there is a new position fix
# assets/fleet-log.js (the growing fleet history) is committed in BOTH modes, at most once every four hours.
# STORY is never touched: the story sentence stays with the Claude refresh.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'compare or publish (empty = the EXO_MODE variable)'
        required: false
        default: ''
      weather:
        description: 'compare mode: fetch weather on this run too'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compute
        id: run
        env:
          EXO_MODE: ${{ inputs.mode || vars.EXO_MODE || 'compare' }}
          EXO_WEATHER: ${{ inputs.weather && '1' || '' }}
        run: node scripts/update-data.mjs
      # Stage 3 of the timeline: the learned polar and the 72-hour forecast for the whole fleet
      # (assets/polar.json, assets/forecast.json). Estimates, never measurements. A failure here never
      # blocks data.js.
      - name: Polar and forecast
        if: steps.run.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/polar-learn.mjs --quiet && node scripts/forecast.mjs
      # c07 (24.9): the weather archive (assets/cond/) rides on this run, so it no longer depends on GitHub's
      # own scheduler - this workflow is woken every half hour by the exodus-clock Worker. It runs when the
      # last archive commit is 5.5 hours old or more (the old schedule was every 6 hours). Never blocks data.js.
      - name: Weather archive
        id: cond
        continue-on-error: true
        timeout-minutes: 12
        env:
          EXO_BUDGET: '1800'
        run: |
          last=$(git log -1 --format=%ct -- assets/cond 2>/dev/null || echo 0)
          age=$(( $(date +%s) - ${last:-0} ))
          if [ "$age" -lt 19800 ]; then echo "archive is $((age/60)) min old - skipped"; exit 0; fi
          node scripts/cond-archive.mjs
      - name: Keep the files for comparison
        if: always() && (failure() || (inputs.mode || vars.EXO_MODE || 'compare') == 'compare')
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: out/
          retention-days: 5
          if-no-files-found: ignore
      # assets/fleet-log.js grows by one point per boat every four hours, in both modes: it is what keeps
      # the globe's day strip honest once the baked history in course.js runs out. It never touches data.js.
      - name: Publish
        if: steps.run.outputs.changed == 'true' || steps.run.outputs.logged == 'true' || steps.cond.outputs.changed == 'true'
        env:
          MSG: "${{ steps.run.outputs.message || steps.cond.outputs.message || 'היסטוריית הצי: נקודות חדשות' }}"
        run: |
          git config user.name "exodus-log data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js assets/fleet-log.js assets/polar.json assets/forecast.json assets/cond
          git diff --cached --quiet || git commit -m "$MSG"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
