name: cond-archive
# Weather archive for the whole race: wind, sea and current where each boat actually was, hour by hour.
# Writes only assets/cond/*.json. Never touches data.js, fleet-log.js or story.js.
# The first runs back-fill from the start (a budget per run keeps it inside Open-Meteo's free quota);
# after that each run adds what is new and refreshes rows younger than 48 hours.
on:
  schedule:
    - cron: '37 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'locations to fetch in this run (each is 2 Open-Meteo calls)'
        required: false
        default: '1800'
permissions:
  contents: write
concurrency:
  group: cond-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch
        id: run
        env:
          EXO_BUDGET: ${{ inputs.budget || '1800' }}
        run: node scripts/cond-archive.mjs
      - name: Publish
        if: steps.run.outputs.changed == 'true'
        env:
          MSG: ${{ steps.run.outputs.message }}
        run: |
          git config user.name "exodus-log data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cond
          git diff --cached --quiet && exit 0
          git commit -m "$MSG"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
